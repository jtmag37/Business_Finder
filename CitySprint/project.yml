# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: CitySprint
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer Team ID here (or in Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES

packages:
  CitySprintCore:
    path: Packages/CitySprintCore

targets:
  CitySprint:
    type: application
    platform: iOS
    sources:
      - path: CitySprint
        excludes:
          - "Resources/Info.plist"
          - "Resources/CitySprint.storekit"
    dependencies:
      - package: CitySprintCore
      - sdk: SpriteKit.framework
      - sdk: GameKit.framework
      - sdk: CloudKit.framework
      - sdk: StoreKit.framework
    entitlements:
      path: CitySprint/Resources/CitySprint.entitlements
      properties:
        com.apple.developer.game-center: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        com.apple.developer.icloud-services:
          - CloudKit
    info:
      path: CitySprint/Resources/Info.plist
      properties:
        CFBundleDisplayName: City Sprint
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.racing-games
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIRequiredDeviceCapabilities:
          - arm64
        UIStatusBarHidden: false
        GKGameCenterBadgingDisabled: false
        # App Transport Security: no NSAppTransportSecurity key on purpose.
        # The defaults (HTTPS + TLS 1.2+, no exceptions) are enforced. The app
        # makes no network requests of its own; only Apple frameworks do.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.citysprint
        PRODUCT_NAME: CitySprint
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  CitySprintTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CitySprintTests]
    dependencies:
      - target: CitySprint
      - package: CitySprintCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.citysprint.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CitySprint.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CitySprint
        BUNDLE_LOADER: $(TEST_HOST)

  CitySprintUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CitySprintUITests]
    dependencies:
      - target: CitySprint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.citysprint.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CitySprint

schemes:
  CitySprint:
    build:
      targets:
        CitySprint: all
        CitySprintTests: [test]
        CitySprintUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: CitySprint/Resources/CitySprint.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CitySprintTests
        - CitySprintUITests
    archive:
      config: Release
